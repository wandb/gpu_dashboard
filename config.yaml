enable_alert: true                        # アラート機能の有効化
ignore_tags: ["other_gpu", "others_gpu"]  # 無視するタグ
wandb_dir: /tmp/wandb                     # wandbの一時ディレクトリ
max_workers: 1                            # 並列処理数
ignore_deleted_run: false                 # 削除されたrunを計算に含めるか

dashboard:
  entity: geniac-gpu                      # wandbのエンティティ名
  project: gpu-dashboard3                 # wandbのプロジェクト名(更新済み)
  # project: gpu-dashboard3-dev  # for development
  tag_for_latest: latest                  # 最新データのタグ

dataset:
  entity: geniac-gpu                      # データセットのエンティティ名
  project: gpu-dashboard3             # データセットのプロジェクト名
  artifact_name: all_runs_data            # アーティファクト名
  deleted_runs_artifact_name: deleted_runs_data  # 削除されたRunのアーティファクト名

# チーム別の挙動上書き（必要な場合のみ使用）
team_overrides:
  ricoh-geniac:
    parse_name_xnode: true               # run.name の "XNode" を後備として解釈
    default_gpus_per_node: 8             # 名称のみから推測時の1ノードGPUデフォルト

